2px", "letterSpacing": "-0.025em", "fontWeight": "600" }], "headline-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "600" }] } } } };</script></head><body class="bg-canvas-paper text-on-surface antialiased selection:bg-primary selection:text-on-primary min-h-screen flex flex-col justify-between"><header class="w-full h-16 flex items-center justify-between px-space-xl"><a class="flex items-center gap-space-xs" data-path="login" href="#"><span class="font-headline-md text-headline-md text-text-primary tracking-tight font-semibold">form<span class="text-primary">ER</span></span></a></header><main class="flex-1 flex items-center justify-center px-space-md py-space-xl"><div class="flex flex-col w-full items-center justify-center py-space-md">
<div class="w-full max-w-[420px] flex flex-col items-center">
<!-- Top System Architecture Badge -->

<!-- Main Authentication Container -->
<div class="w-full bg-surface-clean rounded-lg shadow-sm p-space-xl flex flex-col">
<!-- Card Header -->
<div class="flex flex-col text-left mb-space-lg">
<div class="flex items-center justify-between mb-space-sm">
<div class="font-headline-md text-headline-md text-text-primary tracking-tight font-semibold">
            form<span class="text-accent-teal">ER.</span></div>

</div>
<h1 class="font-headline-md text-headline-md text-text-primary tracking-tight">Welcome back</h1>
<p class="font-body-sm text-body-sm text-text-secondary mt-1">Sign in to access your saved information.</p>
</div>
<!-- Google OAuth Action -->
<button class="w-full h-11 bg-surface-container-low hover:bg-surface-container transition-colors rounded-lg flex items-center justify-center gap-space-sm text-text-primary font-label-md text-label-md active:translate-y-[1px]" id="google-oauth-btn" type="button">
<svg aria-hidden="true" class="w-4 h-4" viewBox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.27 21.41 7.35 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.27 2.59 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span class="">Continue with Google</span>
</button>
<!-- Technical Micro Divider -->
<div class="relative my-space-lg flex items-center justify-center">
<div class="w-full h-[1px] bg-surface-container-high"></div>
<span class="absolute bg-surface-clean px-3 font-technical-meta text-technical-meta text-text-secondary uppercase tracking-wider">
          or continue with email
        </span>
</div>
<!-- Authentication Form -->
<form class="flex flex-col gap-space-md" id="auth-form" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-text-primary" for="email">Email address</label>
<div class="relative">
<input class="w-full h-11 px-3.5 bg-surface-container-lowest text-text-primary font-body-sm text-body-sm rounded-lg focus:outline-none focus:bg-surface-container-lowest placeholder:text-outline-variant transition-colors" id="email" name="email" placeholder="aarav.sharma@domain.co" required="" type="email" style="border: 1px solid rgb(193, 200, 196); background-color: rgb(247, 247, 245);">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-text-primary" for="password">Password</label>
<a class="font-technical-meta text-technical-meta text-accent-teal hover:underline underline-offset-2" href="#">
              Forgot password?
            </a>
</div>
<div class="relative flex items-center">
<input class="w-full h-11 pl-3.5 pr-10 bg-surface-container-lowest text-text-primary font-technical-code text-technical-code rounded-lg focus:outline-none focus:bg-surface-container-lowest placeholder:text-outline-variant transition-colors" id="password" name="password" placeholder="••••••••••••" required="" type="password" style="border: 1px solid rgb(193, 200, 196); background-color: rgb(247, 247, 245);">
<button aria-label="Toggle password visibility" class="absolute right-3 text-text-secondary hover:text-text-primary flex items-center justify-center transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[18px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-11 mt-1 bg-accent-teal hover:bg-primary text-on-primary font-label-md text-label-md font-medium rounded-lg flex items-center justify-center gap-space-xs transition-colors shadow-sm active:translate-y-[1px]" id="submit-btn" type="submit">
<span class="">Sign in</span>
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</form>
<!-- Account Switcher Link -->
<div class="mt-space-lg text-center font-body-sm text-body-sm text-text-secondary">
        Don't have an account? 
        <a class="text-accent-teal font-medium hover:underline underline-offset-2 ml-0.5" href="#">
          Create an account
        </a>
</div>
</div>
<!-- Security Footnote -->
<div class="mt-space-lg flex items-center gap-1.5 text-text-secondary font-technical-meta text-technical-meta">
<span class="material-symbols-outlined text-[15px] text-accent-teal">verified_user</span>
<span class="">Encrypted on your device · Zero automated submissions</span>
</div>
</div>
</div>
<script>
  (function initAuthInteractions() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');
    
    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    const form = document.getElementById('auth-form');
    const submitBtn = document.getElementById('submit-btn');
    if (form && submitBtn) {
      form.addEventListener('submit', () => {
        submitBtn.setAttribute('disabled', 'true');
        submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
        const originalContent = submitBtn.innerHTML;
        submitBtn.innerHTML = `
          <span class="w-3.5 h-3.5 rounded-full border-2 border-surface-clean border-t-transparent animate-spin"></span>
          <span>Verifying credentials...</span>
        `;
        setTimeout(() => {
          submitBtn.removeAttribute('disabled');
          submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
          submitBtn.innerHTML = originalContent;
        }, 1200);
      });
    }
  })();
</script></main><footer class="w-full py-space-md text-center font-technical-meta text-technical-meta text-text-secondary">© 2025 formER Systems. Zero-knowledge identity architecture.</footer>
